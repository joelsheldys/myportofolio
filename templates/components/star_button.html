{% if user.is_authenticated %}
    <form method="post" action="{{ star_url }}" class="star-form">
        {% csrf_token %}
        <button type="submit"
                class="button button-star{% if obj.id in starred_ids %} is-starred{% endif %}">
            <span aria-hidden="true">★</span>
            {% if obj.id in starred_ids %}Unstar{% else %}Star{% endif %}
            <span class="star-count">{{ obj.star_count }}</span>
        </button>
    </form>
{% else %}
    <a href="{% url 'main:login' %}?next={{ request.get_full_path|urlencode }}" class="button button-star">
        <span aria-hidden="true">★</span> Login untuk star
        <span class="star-count">{{ obj.star_count }}</span>
    </a>
{% endif %}
