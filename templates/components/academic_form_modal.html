<div id="academic-form-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="academic-form-modal-title">

    <button type="button"
            class="project-form-modal__backdrop"
            data-close-academic-form
            aria-label="Tutup form tambah riwayat akademik">
    </button>

    <div class="project-form-modal__content">

        <button type="button"
                class="project-form-modal__close"
                data-close-academic-form
                aria-label="Tutup form tambah riwayat akademik">
            ×
        </button>

        <h2 id="academic-form-modal-title">
            Tambah Riwayat Akademik
        </h2>

        <form id="academic-form" class="project-form">
            <p id="academic-form-general-error"
               class="form-error"
               role="alert"></p>

            {% for field in form %}
                <div class="form-group">

                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    <p class="form-error field-error"
                       data-error-for="{{ field.name }}">
                    </p>

                </div>
            {% endfor %}

            <div class="project-form-modal__actions">

                <button type="button"
                        class="button button-secondary"
                        data-close-academic-form>
                    Batal
                </button>

                <button id="academic-form-submit" type="submit" class="button">
                    Tambah Riwayat
                </button>

            </div>

        </form>
    </div>
</div>
